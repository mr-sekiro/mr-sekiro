<svg width="1000" height="360" viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0c1019"/>
      <stop offset="0.85" stop-color="#131019"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="moonGrad" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f5ecd8"/>
      <stop offset="1" stop-color="#dcc9a4"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8d9b4" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#e8d9b4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e8d9b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="160" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="0.5" stop-color="#f5f0e6"/>
      <stop offset="1" stop-color="#e0a458"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e63946" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e63946"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="groundFade" x1="0" y1="270" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070d" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070d" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="postGrad" x1="330" y1="0" x2="670" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c98f3e"/>
      <stop offset="0.5" stop-color="#eec677"/>
      <stop offset="1" stop-color="#c98f3e"/>
    </linearGradient>
    <filter id="mistBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="frame">
      <rect width="1000" height="360" rx="16"/>
    </clipPath>
    <clipPath id="nameClip">
      <text x="500" y="204" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="58" font-weight="700" letter-spacing="4">ABDULLAH HUSSEIN</text>
    </clipPath>
  </defs>

  <style>
    .dot { animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: 0.1; } 50% { opacity: 0.8; } }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 7s ease-in-out infinite; }
    @keyframes halo { 0%,100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.12); opacity: 1; } }
    .mist1 { animation: drift1 26s ease-in-out infinite alternate; }
    .mist2 { animation: drift2 34s ease-in-out infinite alternate; }
    .mist3 { animation: drift1 30s ease-in-out infinite alternate-reverse; }
    @keyframes drift1 { from { transform: translateX(-50px); } to { transform: translateX(70px); } }
    @keyframes drift2 { from { transform: translateX(60px); } to { transform: translateX(-60px); } }
    .enso { animation: ensoDraw 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both; }
    .enso2 { animation: ensoDraw 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.45s both; }
    @keyframes ensoDraw { from { stroke-dasharray: 0 100; } to { stroke-dasharray: 91 9; } }
    .shine { animation: shine 6s ease-in-out 2s infinite; }
    @keyframes shine { 0% { transform: translateX(-260px); } 40%, 100% { transform: translateX(1060px); } }
    .fadeUp { animation: fadeUp 1.1s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .d1 { animation-delay: 0.5s; }
    .d2 { animation-delay: 0.95s; }
    .d3 { animation-delay: 1.3s; }
    @keyframes fadeUp { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .fall  { animation: fall linear infinite; }
    .sway  { animation: sway ease-in-out infinite alternate; }
    .spin  { transform-box: fill-box; transform-origin: center; animation: spinP linear infinite; }
    @keyframes fall  { from { transform: translateY(-40px); } to { transform: translateY(410px); } }
    @keyframes sway  { from { transform: translateX(-22px); } to { transform: translateX(22px); } }
    @keyframes spinP { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .p1 .fall { animation-duration: 11s; animation-delay: -2s; }   .p1 .sway { animation-duration: 3.2s; } .p1 .spin { animation-duration: 6s; }
    .p2 .fall { animation-duration: 14s; animation-delay: -9s; }   .p2 .sway { animation-duration: 4.1s; } .p2 .spin { animation-duration: 8s; }
    .p3 .fall { animation-duration: 9.5s; animation-delay: -5s; }  .p3 .sway { animation-duration: 2.8s; } .p3 .spin { animation-duration: 5s; }
    .p4 .fall { animation-duration: 13s; animation-delay: -1s; }   .p4 .sway { animation-duration: 3.7s; } .p4 .spin { animation-duration: 7s; }
    .p5 .fall { animation-duration: 10.5s; animation-delay: -7s; } .p5 .sway { animation-duration: 3s; }   .p5 .spin { animation-duration: 5.5s; }
    .p6 .fall { animation-duration: 12s; animation-delay: -4s; }   .p6 .sway { animation-duration: 4.4s; } .p6 .spin { animation-duration: 9s; }
    .p7 .fall { animation-duration: 15s; animation-delay: -11s; }  .p7 .sway { animation-duration: 3.5s; } .p7 .spin { animation-duration: 6.5s; }
    .ember { animation: rise ease-in infinite; }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      12% { opacity: 0.9; }
      80% { opacity: 0.5; }
      100% { transform: translateY(-190px); opacity: 0; }
    }
    .e1 { animation-duration: 6s; animation-delay: 0s; }
    .e2 { animation-duration: 7.5s; animation-delay: 2s; }
    .e3 { animation-duration: 5.5s; animation-delay: 4s; }
    .e4 { animation-duration: 8s; animation-delay: 1s; }
    .e5 { animation-duration: 6.8s; animation-delay: 3.2s; }
    .hln { opacity: 0; animation: hcycle 18s linear infinite; }
    .h1 { animation-delay: 0s; }
    .h2 { animation-delay: 4.5s; }
    .h3 { animation-delay: 9s; }
    .h4 { animation-delay: 13.5s; }
    @keyframes hcycle {
      0% { opacity: 0; transform: translateY(5px); }
      2% { opacity: 1; transform: translateY(0); }
      23% { opacity: 1; transform: translateY(0); }
      25% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; }
    }
    .posture {
      transform-box: fill-box;
      transform-origin: center;
      animation: postFill 1.5s cubic-bezier(0.22,1,0.36,1) 1s both, postFlash 4s ease-in-out 2.8s infinite;
    }
    @keyframes postFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes postFlash { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    .kata { animation: kataIn 1.4s cubic-bezier(0.22,1,0.36,1) 1.1s both; }
    @keyframes kataIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 0.65; } }
    .kdb { transform-box: fill-box; transform-origin: center; animation: kdbPulse 2.4s ease-in-out 1.6s infinite; opacity: 0; }
    @keyframes kdbPulse { 0%,100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.4); opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="360" fill="url(#skyGrad)"/>

    <circle class="dot" cx="120" cy="60" r="1.5" fill="#f1f5f9" style="animation-delay:0s"/>
    <circle class="dot" cx="240" cy="110" r="1.2" fill="#e0a458" style="animation-delay:1.2s"/>
    <circle class="dot" cx="330" cy="50" r="1.4" fill="#f1f5f9" style="animation-delay:2.4s"/>
    <circle class="dot" cx="440" cy="85" r="1.1" fill="#f1f5f9" style="animation-delay:0.7s"/>
    <circle class="dot" cx="580" cy="55" r="1.4" fill="#e0a458" style="animation-delay:1.8s"/>
    <circle class="dot" cx="660" cy="120" r="1.2" fill="#f1f5f9" style="animation-delay:3s"/>
    <circle class="dot" cx="960" cy="180" r="1.3" fill="#f1f5f9" style="animation-delay:0.4s"/>
    <circle class="dot" cx="60" cy="180" r="1.2" fill="#e63946" style="animation-delay:2s"/>
    <circle class="dot" cx="905" cy="45" r="1.3" fill="#f1f5f9" style="animation-delay:1.5s"/>
    <circle class="dot" cx="180" cy="230" r="1.1" fill="#e0a458" style="animation-delay:2.8s"/>

    <circle class="halo" cx="838" cy="92" r="92" fill="url(#moonHalo)"/>
    <circle cx="838" cy="92" r="45" fill="url(#moonGrad)" opacity="0.95"/>
    <circle cx="822" cy="78" r="6" fill="#d4c19a" opacity="0.35"/>
    <circle cx="852" cy="102" r="9" fill="#d4c19a" opacity="0.28"/>
    <circle cx="830" cy="108" r="4" fill="#d4c19a" opacity="0.3"/>

    <path d="M0 302 L120 240 L235 284 L395 228 L560 292 L705 244 L845 288 L1000 236 L1000 360 L0 360 Z" fill="#0a0e16"/>

    <g transform="translate(872,268)" fill="#05080e">
      <rect x="-2" y="-62" width="4" height="10"/>
      <path d="M-15 -44 L0 -56 L15 -44 L11 -44 L11 -40 L-11 -40 L-11 -44 Z"/>
      <rect x="-8" y="-40" width="16" height="8"/>
      <path d="M-21 -24 L0 -36 L21 -24 L16 -24 L16 -20 L-16 -20 L-16 -24 Z"/>
      <rect x="-11" y="-20" width="22" height="8"/>
      <path d="M-27 -4 L0 -16 L27 -4 L21 -4 L21 0 L-21 0 L-21 -4 Z"/>
      <rect x="-14" y="0" width="28" height="6"/>
    </g>

    <path d="M0 332 L150 282 L320 326 L520 272 L720 322 L900 278 L1000 306 L1000 360 L0 360 Z" fill="#060a11"/>

    <g class="mist1" filter="url(#mistBlur)"><ellipse cx="260" cy="296" rx="200" ry="24" fill="#8b949e" opacity="0.07"/></g>
    <g class="mist2" filter="url(#mistBlur)"><ellipse cx="640" cy="318" rx="240" ry="26" fill="#8b949e" opacity="0.06"/></g>
    <g class="mist3" filter="url(#mistBlur)"><ellipse cx="860" cy="288" rx="170" ry="20" fill="#8b949e" opacity="0.05"/></g>

    <circle class="enso" cx="500" cy="190" r="128" pathLength="100" stroke="#9c2730" stroke-width="13" stroke-linecap="round" opacity="0.3" transform="rotate(-100 500 190)"/>
    <circle class="enso2" cx="500" cy="190" r="121" pathLength="100" stroke="#a1272f" stroke-width="5" stroke-linecap="round" opacity="0.18" transform="rotate(-95 500 190)"/>

    <g class="fadeUp d1">
      <g clip-path="url(#nameClip)">
        <rect x="130" y="140" width="740" height="84" fill="url(#nameGrad)"/>
        <rect class="shine" x="130" y="140" width="150" height="84" fill="url(#shineGrad)" transform="skewX(-20)"/>
      </g>
    </g>

    <rect x="330" y="222" width="340" height="7" rx="3.5" fill="#241d13"/>
    <rect class="posture" x="330" y="222" width="340" height="7" rx="3.5" fill="url(#postGrad)"/>
    <rect x="414" y="222" width="1.5" height="7" fill="#0d1117" opacity="0.55"/>
    <rect x="584" y="222" width="1.5" height="7" fill="#0d1117" opacity="0.55"/>
    <rect x="493.5" y="219" width="13" height="13" fill="#161b22" stroke="#e0a458" stroke-width="2" transform="rotate(45 500 225.5)"/>

    <circle class="kdb" cx="57" cy="58" r="3.5" fill="#ff4653"/>
    <g class="kata">
      <text x="57" y="76" style="writing-mode:vertical-rl" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="19" letter-spacing="5" fill="#e8dcc2">アブドラ・フセイン</text>
    </g>

    <g class="fadeUp d2">
      <text x="500" y="252" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="9" fill="#e0a458">FULL-STACK .NET DEVELOPER</text>
    </g>

    <g class="fadeUp d3">
      <g class="hln h1"><text x="500" y="292" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14.5" letter-spacing="1" fill="#a8b3bf">Full-stack systems&#160;&#160;·&#160;&#160;<tspan fill="#e63946">ASP.NET Core 8</tspan>&#160;&#160;×&#160;&#160;<tspan fill="#e0a458">React 19</tspan></text></g>
      <g class="hln h2"><text x="500" y="292" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14.5" letter-spacing="1" fill="#a8b3bf">Clean Architecture&#160;&#160;·&#160;&#160;SOLID&#160;&#160;·&#160;&#160;<tspan fill="#e0a458">Design Patterns</tspan></text></g>
      <g class="hln h3"><text x="500" y="292" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14.5" letter-spacing="1" fill="#a8b3bf">EF Core&#160;&#160;·&#160;&#160;SQL Server&#160;&#160;·&#160;&#160;Redis&#160;&#160;·&#160;&#160;<tspan fill="#e63946">Docker</tspan>&#160;&#160;·&#160;&#160;OpenTelemetry</text></g>
      <g class="hln h4"><text x="500" y="292" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14.5" letter-spacing="1" fill="#a8b3bf">Code that ships is good.&#160;&#160;<tspan fill="#e0a458">Code that lasts is better.</tspan></text></g>
    </g>

    <g transform="translate(150,0)"><g class="p1"><g class="fall"><g class="sway"><path class="spin" d="M0 -6 C4 -3 4 3 0 6 C-4 3 -4 -3 0 -6" fill="#dd8f99" opacity="0.7"/></g></g></g></g>
    <g transform="translate(310,0)"><g class="p2"><g class="fall"><g class="sway"><path class="spin" d="M0 -5 C3.5 -2.5 3.5 2.5 0 5 C-3.5 2.5 -3.5 -2.5 0 -5" fill="#c97f8a" opacity="0.65"/></g></g></g></g>
    <g transform="translate(60,0)"><g class="p3"><g class="fall"><g class="sway"><path class="spin" d="M0 -4.5 C3 -2 3 2 0 4.5 C-3 2 -3 -2 0 -4.5" fill="#e0a0aa" opacity="0.6"/></g></g></g></g>
    <g transform="translate(700,0)"><g class="p4"><g class="fall"><g class="sway"><path class="spin" d="M0 -5.5 C4 -3 4 3 0 5.5 C-4 3 -4 -3 0 -5.5" fill="#dd8f99" opacity="0.68"/></g></g></g></g>
    <g transform="translate(870,0)"><g class="p5"><g class="sway"><g class="fall"><path class="spin" d="M0 -4.5 C3 -2 3 2 0 4.5 C-3 2 -3 -2 0 -4.5" fill="#c97f8a" opacity="0.6"/></g></g></g></g>
    <g transform="translate(430,0)"><g class="p6"><g class="fall"><g class="sway"><path class="spin" d="M0 -4 C2.8 -2 2.8 2 0 4 C-2.8 2 -2.8 -2 0 -4" fill="#e0a0aa" opacity="0.55"/></g></g></g></g>
    <g transform="translate(560,0)"><g class="p7"><g class="fall"><g class="sway"><path class="spin" d="M0 -5 C3.5 -2.5 3.5 2.5 0 5 C-3.5 2.5 -3.5 -2.5 0 -5" fill="#dd8f99" opacity="0.62"/></g></g></g></g>

    <g transform="translate(120,345)"><circle class="ember e1" r="2" fill="#e63946"/></g>
    <g transform="translate(260,350)"><circle class="ember e2" r="1.6" fill="#e0a458"/></g>
    <g transform="translate(680,348)"><circle class="ember e3" r="2.2" fill="#e63946"/></g>
    <g transform="translate(800,352)"><circle class="ember e4" r="1.5" fill="#e0a458"/></g>
    <g transform="translate(480,350)"><circle class="ember e5" r="1.8" fill="#e63946"/></g>

    <rect x="0" y="270" width="1000" height="90" fill="url(#groundFade)"/>

    <rect x="0" y="0" width="1000" height="3" fill="url(#accentLine)"/>
    <rect x="0" y="357" width="1000" height="3" fill="url(#accentLine)"/>
  </g>

  <rect x="0.5" y="0.5" width="999" height="359" rx="16" stroke="#21262d"/>
</svg>
