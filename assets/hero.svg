<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#131a24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#e63946" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="150" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="0.5" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e0a458"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63946" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#e63946"/>
      <stop offset="0.8" stop-color="#e0a458"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e63946" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e63946" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e63946"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8b949e" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1000" height="300" rx="16"/>
    </clipPath>
    <clipPath id="nameClip">
      <text x="500" y="148" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="4">ABDULLAH HUSSEIN</text>
    </clipPath>
  </defs>

  <style>
    .pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .shine {
      animation: shine 5s ease-in-out infinite;
    }
    @keyframes shine {
      0% { transform: translateX(-250px); }
      45%, 100% { transform: translateX(1050px); }
    }
    .sweep {
      animation: sweep 9s ease-in-out infinite;
      opacity: 0;
    }
    @keyframes sweep {
      0% { transform: translateX(-120px); opacity: 0; }
      4% { opacity: 1; }
      22% { transform: translateX(1120px); opacity: 0; }
      100% { transform: translateX(1120px); opacity: 0; }
    }
    .underline {
      transform-box: fill-box;
      transform-origin: center;
      animation: growLine 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;
    }
    @keyframes growLine {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .fadeUp { animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.55s; }
    .d3 { animation-delay: 0.95s; }
    @keyframes fadeUp {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .dot { animation: twinkle 3.2s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.85; }
    }
    .corner {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawCorner 1.2s ease-out 1.1s forwards;
    }
    @keyframes drawCorner {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bgGrad)"/>
    <rect width="1000" height="300" fill="url(#dotGrid)"/>

    <circle class="pulse" cx="500" cy="135" r="105" fill="url(#sunGrad)"/>

    <text x="985" y="245" text-anchor="end" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="150" font-weight="700" fill="#e63946" opacity="0.07">隻狼</text>
    <text x="18" y="245" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="150" font-weight="700" fill="#e0a458" opacity="0.05">忍</text>

    <g class="sweep">
      <rect x="0" y="-60" width="5" height="420" fill="url(#sweepGrad)" transform="skewX(-16)"/>
    </g>

    <circle class="dot" cx="150" cy="70" r="2" fill="#e63946" style="animation-delay:0s"/>
    <circle class="dot" cx="260" cy="220" r="1.6" fill="#e0a458" style="animation-delay:0.7s"/>
    <circle class="dot" cx="820" cy="80" r="2" fill="#e0a458" style="animation-delay:1.3s"/>
    <circle class="dot" cx="905" cy="180" r="1.6" fill="#e63946" style="animation-delay:2s"/>
    <circle class="dot" cx="90" cy="160" r="1.4" fill="#f1f5f9" style="animation-delay:2.6s"/>
    <circle class="dot" cx="700" cy="250" r="1.4" fill="#f1f5f9" style="animation-delay:1.8s"/>
    <circle class="dot" cx="380" cy="45" r="1.4" fill="#e0a458" style="animation-delay:0.4s"/>
    <circle class="dot" cx="640" cy="40" r="1.6" fill="#e63946" style="animation-delay:2.9s"/>

    <g class="fadeUp d1">
      <g clip-path="url(#nameClip)">
        <rect x="120" y="85" width="760" height="85" fill="url(#nameGrad)"/>
        <rect class="shine" x="120" y="85" width="140" height="85" fill="url(#shineGrad)" transform="skewX(-20)"/>
      </g>
    </g>

    <rect class="underline" x="380" y="166" width="240" height="3" rx="1.5" fill="url(#underlineGrad)"/>

    <g class="fadeUp d2">
      <text x="500" y="212" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="9" fill="#e0a458">.NET BACKEND DEVELOPER</text>
    </g>

    <g class="fadeUp d3">
      <text x="500" y="256" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.5" fill="#8b949e">C#  ·  ASP.NET CORE  ·  EF CORE  ·  SQL SERVER  ·  CLEAN ARCHITECTURE</text>
    </g>

    <rect x="0" y="0" width="1000" height="3" fill="url(#topAccent)"/>
    <rect x="0" y="297" width="1000" height="3" fill="url(#topAccent)"/>

    <path class="corner" d="M 24 52 L 24 24 L 52 24" stroke="#e63946" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="corner" d="M 948 24 L 976 24 L 976 52" stroke="#e0a458" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="corner" d="M 976 248 L 976 276 L 948 276" stroke="#e63946" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="corner" d="M 52 276 L 24 276 L 24 248" stroke="#e0a458" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <rect x="0.5" y="0.5" width="999" height="299" rx="16" stroke="#21262d"/>
</svg>
