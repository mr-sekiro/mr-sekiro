<svg width="700" height="150" viewBox="0 0 700 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qRuleL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e0a458"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="qRuleR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0a458"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .jp { animation: qIn 1.3s cubic-bezier(0.22,1,0.36,1) 0.2s both; }
    .en { animation: qIn 1.1s cubic-bezier(0.22,1,0.36,1) 0.9s both; }
    @keyframes qIn {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .ruleL, .ruleR { transform-box: fill-box; animation: qGrow 1.2s cubic-bezier(0.22,1,0.36,1) 1.2s both; }
    .ruleL { transform-origin: right center; }
    .ruleR { transform-origin: left center; }
    @keyframes qGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .gem { transform-box: fill-box; transform-origin: center; animation: gemIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.6s both, gemPulse 4s ease-in-out 2.2s infinite; }
    @keyframes gemIn { from { transform: scale(0) rotate(45deg); opacity: 0; } to { transform: scale(1) rotate(45deg); opacity: 1; } }
    @keyframes gemPulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    .mark { animation: markIn 2s ease-out 0.4s both; }
    @keyframes markIn { from { opacity: 0; } to { opacity: 0.06; } }
  </style>

  <text class="mark" x="350" y="120" text-anchor="middle" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="130" font-weight="700" fill="#e63946" opacity="0.06">迷</text>

  <g class="jp">
    <text x="350" y="66" text-anchor="middle" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="34" font-weight="600" letter-spacing="4" fill="#f1f5f9">「<tspan fill="#e63946">迷えば</tspan>、<tspan fill="#e0a458">敗れる</tspan>」</text>
  </g>

  <rect class="ruleL" x="128" y="107" width="120" height="1.5" rx="0.75" fill="url(#qRuleL)"/>
  <rect class="ruleR" x="452" y="107" width="120" height="1.5" rx="0.75" fill="url(#qRuleR)"/>
  <rect class="gem" x="345" y="103" width="9" height="9" fill="none" stroke="#e63946" stroke-width="1.8"/>

  <g class="en">
    <text x="350" y="138" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="15" font-style="italic" letter-spacing="3" fill="#8b949e">Hesitation is defeat.</text>
  </g>
</svg>
