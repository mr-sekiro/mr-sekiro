<svg width="1000" height="310" viewBox="0 0 1000 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="abPanel" x1="0" y1="0" x2="1000" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#11161f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="abTrail" x1="60" y1="0" x2="940" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#e0a458"/>
    </linearGradient>
    <radialGradient id="abNodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <pattern id="abDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8b949e" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="abFrame"><rect width="1000" height="310" rx="14"/></clipPath>
  </defs>

  <style>
    .prose { animation: pIn 1.1s cubic-bezier(0.22,1,0.36,1) both; }
    .pr2 { animation-delay: 0.25s; }
    @keyframes pIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .trail {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: trailDraw 2.4s cubic-bezier(0.4,0,0.2,1) 0.5s forwards;
    }
    @keyframes trailDraw { to { stroke-dashoffset: 0; } }
    .mk { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: mkPop 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    @keyframes mkPop { to { transform: scale(1); } }
    .mlbl { opacity: 0; animation: mFade 0.7s ease-out forwards; }
    @keyframes mFade { to { opacity: 1; } }
    .m1 { animation-delay: 0.9s; }
    .m2 { animation-delay: 1.4s; }
    .m3 { animation-delay: 1.9s; }
    .m4 { animation-delay: 2.4s; }
    .glowP { transform-box: fill-box; transform-origin: center; animation: gPulse 3s ease-in-out 3s infinite both; opacity: 0; }
    @keyframes gPulse { 0%,100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.25); } }
    .wolfrun { animation: mFade 0.7s ease-out 2.8s forwards; opacity: 0; }
  </style>

  <g clip-path="url(#abFrame)">
    <rect width="1000" height="310" fill="url(#abPanel)"/>
    <rect width="1000" height="310" fill="url(#abDots)"/>
    <text x="14" y="290" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="170" font-weight="700" fill="#e63946" opacity="0.045">我</text>

    <g class="prose">
      <text x="500" y="58" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="18" font-style="italic" fill="#e8edf3">I build products end to end&#160;·&#160;from the <tspan fill="#e63946">SQL schema</tspan> to the last <tspan fill="#e0a458">React pixel</tspan>.</text>
    </g>
    <g class="prose pr2">
      <text x="500" y="86" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="15" font-style="italic" fill="#8b949e">Backend architecture is my blade. The frontend is its second edge.</text>
    </g>

    <path class="trail" d="M60 218 C 80 212, 95 208, 110 205 C 200 195, 290 178, 380 185 C 470 192, 560 215, 650 210 C 730 206, 820 188, 890 180" stroke="url(#abTrail)" stroke-width="2.5" stroke-linecap="round" pathLength="1000"/>
    <circle cx="60" cy="218" r="4" fill="#e63946"/>

    <g class="mk m1">
      <rect x="103" y="198" width="14" height="14" fill="#161b22" stroke="#e0a458" stroke-width="2" transform="rotate(45 110 205)"/>
    </g>
    <g class="mlbl m1">
      <text x="110" y="186" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#e0a458">2023</text>
      <text x="110" y="235" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2" fill="#f1f5f9">FOUNDATIONS</text>
      <text x="110" y="254" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">C# · OOP · problem solving</text>
    </g>

    <g class="mk m2">
      <rect x="373" y="178" width="14" height="14" fill="#161b22" stroke="#e0a458" stroke-width="2" transform="rotate(45 380 185)"/>
    </g>
    <g class="mlbl m2">
      <text x="380" y="166" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#e0a458">2024</text>
      <text x="380" y="215" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2" fill="#f1f5f9">THE FORGE</text>
      <text x="380" y="234" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">WPF · WinForms · SQL Server</text>
    </g>

    <g class="mk m3">
      <rect x="643" y="203" width="14" height="14" fill="#161b22" stroke="#e0a458" stroke-width="2" transform="rotate(45 650 210)"/>
    </g>
    <g class="mlbl m3">
      <text x="650" y="191" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#e0a458">2025</text>
      <text x="650" y="240" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2" fill="#f1f5f9">BACKEND ASCENT</text>
      <text x="650" y="259" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">ASP.NET Core · EF Core · Node.js</text>
    </g>

    <circle class="glowP" cx="890" cy="180" r="22" fill="url(#abNodeGlow)"/>
    <g class="mk m4">
      <rect x="881" y="171" width="18" height="18" fill="#e63946" stroke="#e0a458" stroke-width="2.5" transform="rotate(45 890 180)"/>
    </g>
    <g class="mlbl m4">
      <text x="890" y="156" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#e0a458">2026</text>
      <text x="890" y="214" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2" fill="#f1f5f9">FULL-STACK</text>
      <text x="890" y="233" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">React 19 · Next.js 16 · 3 products live</text>
    </g>

    <g class="wolfrun">
      <text x="60" y="290" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="15" fill="#e0a458" opacity="0.9">狼</text>
      <text x="82" y="290" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1" fill="#8b949e">the path continues...</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="309" rx="14" stroke="#21262d"/>
</svg>
