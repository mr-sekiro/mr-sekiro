<svg width="1000" height="330" viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="abPanel" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#11161f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="abSep" x1="0" y1="40" x2="0" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#30363d"/>
      <stop offset="1" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="abGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <pattern id="abDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8b949e" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="abFrame"><rect width="1000" height="330" rx="14"/></clipPath>
  </defs>

  <style>
    .ring { transform-box: fill-box; transform-origin: center; animation: spinSlow 26s linear infinite; }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .pIn { transform-box: fill-box; transform-origin: center; animation: pIn 0.8s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes pIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .row { animation: rowIn 0.8s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes rowIn { from { transform: translateX(18px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .w1 { animation-delay: 0.35s; } .w2 { animation-delay: 0.5s; } .w3 { animation-delay: 0.65s; }
    .w4 { animation-delay: 0.8s; } .w5 { animation-delay: 0.95s; } .w6 { animation-delay: 1.1s; }
    .w7 { animation-delay: 1.35s; }
    .nm { animation: rowIn 0.8s cubic-bezier(0.22,1,0.36,1) 0.25s both; }
  </style>

  <g clip-path="url(#abFrame)">
    <rect width="1000" height="330" fill="url(#abPanel)"/>
    <rect width="1000" height="330" fill="url(#abDots)"/>
    <text x="14" y="310" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="170" font-weight="700" fill="#e63946" opacity="0.045">我</text>

    <circle class="breathe" cx="155" cy="128" r="86" fill="url(#abGlow)"/>
    <g class="pIn">
      <circle class="ring" cx="155" cy="128" r="66" stroke="#e63946" stroke-width="1.5" stroke-dasharray="7 10" opacity="0.5"/>
      <circle cx="155" cy="128" r="52" fill="#161b22" stroke="#e63946" stroke-width="2"/>
      <circle cx="155" cy="128" r="46" fill="none" stroke="#e0a458" stroke-width="1" opacity="0.35"/>
      <text x="155" y="146" text-anchor="middle" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="50" font-weight="700" fill="#f1f5f9">狼</text>
      <text x="113" y="136" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" font-weight="600" fill="#e0a458" opacity="0.85">&lt;</text>
      <text x="182" y="136" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" font-weight="600" fill="#e0a458" opacity="0.85">/&gt;</text>
    </g>
    <g class="nm">
      <text x="155" y="232" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="19" font-weight="700" letter-spacing="2" fill="#f1f5f9">ABDULLAH HUSSEIN</text>
      <text x="155" y="256" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#8b949e">@mr-sekiro</text>
      <text x="155" y="284" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#e0a458">BACKEND ROOTS · FULL-STACK BLADE</text>
    </g>

    <rect x="310" y="40" width="1.5" height="250" fill="url(#abSep)"/>

    <g class="row w1">
      <rect x="348" y="61" width="8" height="8" fill="none" stroke="#e63946" stroke-width="1.8" transform="rotate(45 352 65)"/>
      <text x="372" y="70" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#e0a458">ROLE</text>
      <text x="510" y="70" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#e8edf3">Full-Stack Developer&#160;&#160;—&#160;&#160;.NET × React</text>
    </g>
    <g class="row w2">
      <rect x="348" y="98" width="8" height="8" fill="none" stroke="#e63946" stroke-width="1.8" transform="rotate(45 352 102)"/>
      <text x="372" y="107" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#e0a458">FOCUS</text>
      <text x="510" y="107" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#c9d1d9">Scalable systems · Clean Architecture · SOLID</text>
    </g>
    <g class="row w3">
      <rect x="348" y="135" width="8" height="8" fill="none" stroke="#e63946" stroke-width="1.8" transform="rotate(45 352 139)"/>
      <text x="372" y="144" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#e0a458">BACKEND</text>
      <text x="510" y="144" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#c9d1d9">ASP.NET Core 8 · EF Core · SQL Server · Redis</text>
    </g>
    <g class="row w4">
      <rect x="348" y="172" width="8" height="8" fill="none" stroke="#e63946" stroke-width="1.8" transform="rotate(45 352 176)"/>
      <text x="372" y="181" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#e0a458">FRONTEND</text>
      <text x="510" y="181" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#c9d1d9">React 19 · Next.js 16 · TypeScript · Tailwind CSS</text>
    </g>
    <g class="row w5">
      <rect x="348" y="209" width="8" height="8" fill="none" stroke="#e63946" stroke-width="1.8" transform="rotate(45 352 213)"/>
      <text x="372" y="218" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#e0a458">SECURITY</text>
      <text x="510" y="218" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#c9d1d9">ASP.NET Identity · JWT · OAuth 2.0</text>
    </g>
    <g class="row w6">
      <rect x="348" y="246" width="8" height="8" fill="none" stroke="#e63946" stroke-width="1.8" transform="rotate(45 352 250)"/>
      <text x="372" y="255" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#e0a458">PRODUCTION</text>
      <text x="510" y="255" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#c9d1d9">Docker · CI/CD · OpenTelemetry · Prometheus · xUnit</text>
    </g>
    <g class="row w7">
      <text x="510" y="296" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="14.5" font-style="italic" fill="#e0a458">「 Code that ships is good. Code that lasts is better. 」</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="329" rx="14" stroke="#21262d"/>
</svg>
