<svg width="1000" height="84" viewBox="0 0 1000 84" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dlgAccent" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e63946" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e63946" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .ln { opacity: 0; animation: cycle 18s linear infinite; }
    .ln1 { animation-delay: 0s; }
    .ln2 { animation-delay: 4.5s; }
    .ln3 { animation-delay: 9s; }
    .ln4 { animation-delay: 13.5s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(6px); }
      2% { opacity: 1; transform: translateY(0); }
      23% { opacity: 1; transform: translateY(0); }
      25% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; }
    }
    .gem { transform-box: fill-box; transform-origin: center; animation: gemSpin 7s linear infinite; }
    @keyframes gemSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .cur { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="999" height="83" rx="12" fill="#0d1117" stroke="#21262d"/>
  <rect x="20" y="0" width="960" height="2" fill="url(#dlgAccent)"/>

  <rect class="gem" x="34" y="35" width="14" height="14" fill="none" stroke="#e0a458" stroke-width="2.2" transform="rotate(45 41 42)"/>

  <g class="ln ln1"><text x="500" y="49" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="16" fill="#c9d1d9">Full-stack systems&#160;&#160;·&#160;&#160;<tspan fill="#e63946">ASP.NET Core 8</tspan>&#160;&#160;×&#160;&#160;<tspan fill="#e0a458">React 19</tspan></text></g>
  <g class="ln ln2"><text x="500" y="49" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="16" fill="#c9d1d9">Clean Architecture&#160;&#160;·&#160;&#160;SOLID&#160;&#160;·&#160;&#160;<tspan fill="#e0a458">Design Patterns</tspan></text></g>
  <g class="ln ln3"><text x="500" y="49" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="16" fill="#c9d1d9">EF Core&#160;&#160;·&#160;&#160;SQL Server&#160;&#160;·&#160;&#160;Redis&#160;&#160;·&#160;&#160;<tspan fill="#e63946">Docker</tspan>&#160;&#160;·&#160;&#160;OpenTelemetry</text></g>
  <g class="ln ln4"><text x="500" y="49" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="16" fill="#c9d1d9">Code that ships is good.&#160;&#160;<tspan fill="#e0a458">Code that lasts is better.</tspan></text></g>

  <rect class="cur" x="952" y="36" width="9" height="14" fill="#e63946" opacity="0.9"/>
</svg>
