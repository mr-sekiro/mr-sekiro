<svg width="900" height="92" viewBox="0 0 900 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="460" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e63946"/><stop offset="1" stop-color="#e0a458"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e63946"/><stop offset="0.4" stop-color="#e0a458"/><stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .rule { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.4s cubic-bezier(0.22,1,0.36,1) 0.25s forwards; }
    .rule2 { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.4s cubic-bezier(0.22,1,0.36,1) 0.4s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .title { animation: slideIn 0.9s cubic-bezier(0.22,1,0.36,1) both; }
    .sub { animation: slideIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.2s both; }
    @keyframes slideIn { from { transform: translateX(-14px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .gem { transform-box: fill-box; transform-origin: center; animation: spin 7s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
  <g class="title">
    <rect class="gem" x="8" y="24" width="14" height="14" fill="none" stroke="#e63946" stroke-width="2.5" transform="rotate(45 15 31)"/>
    <text x="44" y="41" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="29" font-weight="700" letter-spacing="6" fill="url(#titleGrad)">SKILL TREE</text>
  </g>
  <g class="sub">
    <text x="46" y="62" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="12" letter-spacing="4" fill="#8b949e">スキルツリー</text>
  </g>
  <text x="893" y="56" text-anchor="end" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="48" font-weight="700" fill="#e63946" opacity="0.25">技</text>
  <path class="rule" d="M8 78 C 240 72, 480 83, 892 76" stroke="url(#ruleGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path class="rule2" d="M8 82 C 300 78, 560 86, 892 80" stroke="url(#ruleGrad)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.45"/>
</svg>
