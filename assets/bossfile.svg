<svg width="1000" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bfVital" x1="64" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8f2129"/>
      <stop offset="0.55" stop-color="#b32633"/>
      <stop offset="1" stop-color="#8f2129"/>
    </linearGradient>
    <linearGradient id="bfPosture" x1="64" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9954e"/>
      <stop offset="0.5" stop-color="#e8c983"/>
      <stop offset="1" stop-color="#b9954e"/>
    </linearGradient>
  </defs>

  <style>
    .dbdot { transform-box: fill-box; transform-origin: center; animation: dbIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
    .dbd2 { animation-delay: 0.2s; }
    @keyframes dbIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .bname { animation: bnIn 1s cubic-bezier(0.22,1,0.36,1) 0.15s both; }
    @keyframes bnIn { from { transform: translateX(-16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .vital {
      transform-box: fill-box; transform-origin: left center;
      animation: vFill 1.8s cubic-bezier(0.22,1,0.36,1) 0.6s both;
    }
    @keyframes vFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .post {
      transform-box: fill-box; transform-origin: center;
      animation: vFill 1.4s cubic-bezier(0.22,1,0.36,1) 1s both, pFlash 5s ease-in-out 3s infinite;
    }
    @keyframes pFlash { 0%,100% { opacity: 0.9; } 50% { opacity: 1; } }
    .row { opacity: 0; animation: rIn 0.7s cubic-bezier(0.22,1,0.36,1) forwards; }
    .r1 { animation-delay: 0.9s; } .r2 { animation-delay: 1.05s; } .r3 { animation-delay: 1.2s; }
    .r4 { animation-delay: 1.35s; } .r5 { animation-delay: 1.5s; }
    @keyframes rIn { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .frame { animation: rIn 0.8s cubic-bezier(0.22,1,0.36,1) 0.5s both; }
    .stamp { transform-box: fill-box; transform-origin: center; animation: stIn 0.45s cubic-bezier(0.34,1.56,0.64,1) 1.9s both; }
    @keyframes stIn { from { transform: scale(2.1) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-12deg); opacity: 1; } }
    .live { animation: lv 2s ease-in-out infinite; }
    @keyframes lv { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .fno { opacity: 0; animation: rIn 1s ease-out 2.2s forwards; }
  </style>

  <rect x="0.5" y="0.5" width="999" height="339" rx="14" fill="#0b0e14" stroke="#21262d"/>

  <circle class="dbdot" cx="70" cy="56" r="6.5" fill="#c9252f" stroke="#42151a" stroke-width="2.5"/>
  <circle class="dbdot dbd2" cx="93" cy="56" r="6.5" fill="#c9252f" stroke="#42151a" stroke-width="2.5"/>
  <g class="bname">
    <text x="116" y="64" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="25" font-weight="700" letter-spacing="3" fill="#f1f5f9">ABDULLAH HUSSEIN&#160;&#160;<tspan font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="21" fill="#e63946">隻狼</tspan></text>
  </g>

  <rect x="64" y="78" width="636" height="4" rx="2" fill="#241d12"/>
  <rect class="post" x="64" y="78" width="636" height="4" rx="2" fill="url(#bfPosture)"/>

  <rect x="62" y="88" width="640" height="17" rx="3" fill="#150b0c" stroke="#6d5a3a" stroke-width="1.5"/>
  <rect class="vital" x="65" y="91" width="634" height="11" rx="2" fill="url(#bfVital)"/>
  <rect x="65" y="91" width="634" height="3" rx="1.5" fill="#d4555f" opacity="0.35"/>

  <g class="row r1">
    <text x="64" y="152" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3" fill="#a08858">NAME</text>
    <line x1="180" y1="148" x2="330" y2="148" stroke="#a08858" stroke-width="1.5" stroke-dasharray="1.5 6" opacity="0.4"/>
    <text x="350" y="152" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#e8edf3">Abdullah Hussein</text>
  </g>
  <g class="row r2">
    <text x="64" y="186" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3" fill="#a08858">CODENAME</text>
    <line x1="180" y1="182" x2="330" y2="182" stroke="#a08858" stroke-width="1.5" stroke-dasharray="1.5 6" opacity="0.4"/>
    <text x="350" y="186" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14.5" fill="#e8edf3">mr-sekiro&#160;&#160;<tspan fill="#e63946">狼</tspan></text>
  </g>
  <g class="row r3">
    <text x="64" y="220" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3" fill="#a08858">CLASS</text>
    <line x1="180" y1="216" x2="330" y2="216" stroke="#a08858" stroke-width="1.5" stroke-dasharray="1.5 6" opacity="0.4"/>
    <text x="350" y="220" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#e8edf3">Full-Stack Developer&#160;·&#160;.NET × React</text>
  </g>
  <g class="row r4">
    <text x="64" y="254" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3" fill="#a08858">ARSENAL</text>
    <line x1="180" y1="250" x2="330" y2="250" stroke="#a08858" stroke-width="1.5" stroke-dasharray="1.5 6" opacity="0.4"/>
    <text x="350" y="254" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#e8edf3">ASP.NET Core 8&#160;·&#160;React 19&#160;·&#160;SQL Server&#160;·&#160;Docker</text>
  </g>
  <g class="row r5">
    <text x="64" y="288" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3" fill="#a08858">STATUS</text>
    <line x1="180" y1="284" x2="330" y2="284" stroke="#a08858" stroke-width="1.5" stroke-dasharray="1.5 6" opacity="0.4"/>
    <circle class="live" cx="356" cy="283" r="4" fill="#e0a458"/>
    <text x="370" y="288" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#e0a458">SHIPPING IN PRODUCTION</text>
  </g>

  <g class="frame">
    <rect x="775" y="128" width="160" height="160" fill="#0e1219" stroke="#21262d"/>
    <path d="M 775 146 L 775 128 L 793 128" stroke="#e63946" stroke-width="2.5" fill="none"/>
    <path d="M 917 128 L 935 128 L 935 146" stroke="#e63946" stroke-width="2.5" fill="none"/>
    <path d="M 935 270 L 935 288 L 917 288" stroke="#e63946" stroke-width="2.5" fill="none"/>
    <path d="M 793 288 L 775 288 L 775 270" stroke="#e63946" stroke-width="2.5" fill="none"/>
    <circle cx="855" cy="204" r="52" stroke="#6d5a3a" stroke-width="1" opacity="0.5"/>
    <text x="855" y="234" text-anchor="middle" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="84" font-weight="700" fill="#f1f5f9">狼</text>
    <text x="855" y="308" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="10" letter-spacing="3" fill="#a08858" opacity="0.7">MASK ON FILE</text>
  </g>

  <g class="stamp">
    <rect x="712" y="120" width="182" height="52" rx="6" fill="none" stroke="#c9252f" stroke-width="3"/>
    <text x="803" y="147" text-anchor="middle" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', serif" font-size="21" font-weight="700" fill="#c9252f">不敗</text>
    <text x="803" y="165" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#c9252f">UNDEFEATED</text>
  </g>

  <text class="fno" x="936" y="326" text-anchor="end" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#a08858" opacity="0.4">FILE NO. 狼-2023-08</text>
</svg>
